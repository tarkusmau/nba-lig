name: Lig verisi güncelle
on:
  schedule:
    - cron: "17 6 * * *"
    - cron: "17 17 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: lig-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4
      - name: Yahoo'dan veriyi çek
        env:
          YAHOO_COOKIE: ${{ secrets.YAHOO_COOKIE }}
          LEAGUE_ID: "71722"
        run: python scripts/scrape.py
      - name: Kaydet
        if: always()
        run: |
          git config user.name "lig-bot"
          git config user.email "lig-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Otomatik güncelleme ($(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M'))" && git pull --rebase && git push)
