name: Yahoo sayfa testi
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sayfalari indir
        env:
          YAHOO_COOKIE: ${{ secrets.YAHOO_COOKIE }}
        run: |
          mkdir -p probe
          python3 - <<'EOF'
          import os, re, urllib.request
          ck = os.environ.get("YAHOO_COOKIE", "").strip()
          base = "https://basketball.fantasysports.yahoo.com/nba/71722"
          pages = {"home": base, "matchup": base + "/matchup?week=4&mid1=1",
                   "scoreboard": base + "?matchup_week=4&module=matchups",
                   "transactions": base + "/transactions"}
          log = ["cookie uzunluk: %d" % len(ck)]
          for name, url in pages.items():
              req = urllib.request.Request(url, headers={"Cookie": ck,
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/142.0 Safari/537.36",
                  "Accept-Language": "en-US,en;q=0.9"})
              try:
                  r = urllib.request.urlopen(req, timeout=30)
                  html = r.read().decode("utf-8", "replace")
                  log.append(f"{name}: {r.status} {r.geturl()} {len(html)}")
              except Exception as e:
                  log.append(f"{name}: HATA {e}")
                  continue
              html = re.sub(r"(?is)<(script|style|noscript)\b.*?</\1>", "", html)
              html = re.sub(r"[\w.+-]+@[\w-]+\.[\w.]+", "[email]", html)
              html = re.sub(r"(?i)crumb[^\s\"'<>]*", "[crumb]", html)
              open(f"probe/{name}.html", "w").write(html)
          open("probe/log.txt", "w").write("\n".join(log) + "\n")
          print("\n".join(log))
          EOF
      - name: Kaydet
        run: |
          git config user.name "lig-bot"
          git config user.email "lig-bot@users.noreply.github.com"
          git add probe
          git diff --cached --quiet || (git commit -m "Yahoo sayfa testi" && git push)
